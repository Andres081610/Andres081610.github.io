descripcion: "Ingeniero electrónico: proyectos de embebidos, IoT, PCB, diseño mecánico e IA generativa, con tutoriales paso a paso."
ubicacion: "Querétaro, México · de Colombia"
email: "jehisonandresr@gmail.com"
