# Si publicas en https://usuario.github.io deja baseurl: ""
baseurl: ""
url: "https://andres081610.github.io"

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

collections:
  proyectos:
    output: true
    permalink: /proyectos/:name/
  tutoriales:
    output: true
    permalink: /tutoriales/:name/

defaults:
  - scope: { path: "", type: proyectos }
    values: { layout: proyecto }
  - scope: { path: "", type: tutoriales }
    values: { layout: tutorial }
  - scope: { path: "" }
    values: { layout: default }

exclude: [README.md, CRITICA-UX.md, CNAME, Gemfile, Gemfile.lock, vendor, PLANTILLA-proyecto.md, PLANTILLA-tutorial.md]

plugins:
  - jekyll-sitemap
