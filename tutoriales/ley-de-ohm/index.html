    <script>
    /* Voz natural sin servidor: la app pide la voz a /api/tts, que no existe en GitHub Pages.
       Aquí se responde con narraciones pregrabadas (voz/<voz>/<sha1 del texto>.mp3). */
    (function(){
      var VOZ={Kore:'dora',Zephyr:'dora',Puck:'alex',Fenrir:'alex'};
      var base=new URL('./voz/',document.baseURI||location.href).href;
      var orig=window.fetch.bind(window);
      function b64(buf){var s='',b=new Uint8Array(buf),n=0x8000;for(var i=0;i<b.length;i+=n)s+=String.fromCharCode.apply(null,b.subarray(i,i+n));return btoa(s);}
      async function sha1(t){var d=await crypto.subtle.digest('SHA-1',new TextEncoder().encode(t));return Array.from(new Uint8Array(d)).map(function(x){return x.toString(16).padStart(2,'0')}).join('').slice(0,12);}
      window.fetch=function(u,o){
        var url=typeof u==='string'?u:(u&&u.url)||'';
        if(url.indexOf('/api/tts')<0)return orig(u,o);
        return (async function(){
          try{var q=JSON.parse(o&&o.body||'{}'),h=await sha1(q.text||''),v=VOZ[q.voiceName]||'dora';
            var r=await orig(base+v+'/'+h+'.mp3');if(!r.ok)throw 0;
            return new Response(JSON.stringify({success:true,audioBase64:b64(await r.arrayBuffer())}),{headers:{'Content-Type':'application/json'}});
          }catch(e){return new Response(JSON.stringify({success:false}),{status:404,headers:{'Content-Type':'application/json'}});}
        })();
      };
    })();
    </script>
