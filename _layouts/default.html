<!doctype html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% assign t = page.titulo | default: page.title %}
  <title>{% if t %}{{ t }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.resumen | default: site.descripcion | strip_html | truncate: 160 }}">
  <meta property="og:title" content="{{ t | default: site.title }}">
  <meta property="og:description" content="{{ page.resumen | default: site.descripcion | strip_html | truncate: 160 }}">
  {% if page.portada %}<meta property="og:image" content="{{ page.portada | absolute_url }}">{% endif %}
  <meta name="theme-color" content="#05070d">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Orbitron:wght@500;700;900&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div><div class="bg-glow" aria-hidden="true"></div>
  {% include header.html %}
  <main id="contenido">{{ content }}</main>
  {% include footer.html %}
  <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
</body>
</html>
