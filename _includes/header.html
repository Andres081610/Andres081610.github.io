<a class="skip" href="#contenido">Saltar al contenido</a>
<header class="site-header">
  <div class="wrap header-inner">
    <a class="logo" href="{{ '/' | relative_url }}"><span class="logo-mark" aria-hidden="true"></span>{{ site.title }}</a>
    <button class="menu-btn" aria-label="Abrir menú" aria-expanded="false" data-menu>☰</button>
    <nav class="nav" data-nav>
      {% assign p = page.url %}
      <a href="{{ '/proyectos/' | relative_url }}" {% if p contains '/proyectos/' %}aria-current="page"{% endif %}>Proyectos</a>
      <a href="{{ '/tutoriales/' | relative_url }}" {% if p contains '/tutoriales/' %}aria-current="page"{% endif %}>Tutoriales</a>
      <a href="{{ '/asesorias/' | relative_url }}" {% if p contains '/asesorias/' %}aria-current="page"{% endif %}>Tutorías</a>
      <a href="{{ '/sobre/' | relative_url }}" {% if p contains '/sobre/' %}aria-current="page"{% endif %}>Sobre mí</a>
      <a href="{{ '/contacto/' | relative_url }}" {% if p contains '/contacto/' %}aria-current="page"{% endif %}>Contacto</a>
      <button class="theme-btn" type="button" data-theme-toggle aria-label="Cambiar entre modo oscuro y claro" title="Modo claro / oscuro"><span class="i-moon" aria-hidden="true">☾</span><span class="i-sun" aria-hidden="true">☀</span></button>
    </nav>
  </div>
</header>
